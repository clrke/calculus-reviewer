  // Separate topic from the derivative levels above — kept out of LEVELS (and
  // given a num far outside 0-4) so it can never get chained in as a "next
  // level" after Level 4, and so startLevel's data-start-level/parseInt path
  // and the num+1 "next level" lookup both just work unmodified.
  const EXAMS = [
    { num: 100, title: "Limits Mock Exam", desc: "12 questions covering direct substitution, factoring/rationalizing 0/0 forms, one-sided and infinite limits, limits at infinity (comparing degrees), and the squeeze theorem.", gen: () => QL.generateLimitsExam(12), kind: "mc", isExam: true },
    { num: 101, title: "Optimization Mock Exam", desc: "7 classic maxima/minima applications: minimizing sums, fencing/area problems, box-cutting, page margins, inscribed shapes, and the rowboat direction problem.", gen: () => QL.generateOptimizationExam(7), kind: "mc", isExam: true },
    { num: 102, title: "Implicit Differentiation Mock Exam", desc: "6 questions on finding dy/dx (and y″) for equations that mix x and y, plus evaluating the tangent slope at a specific point on an implicit curve.", gen: () => QL.generateImplicitExam(6), kind: "mc", isExam: true },
    { num: 103, title: "Derivative by Definition Mock Exam", desc: "8 questions using the increment (four-step) method: linear, quadratic, rational, radical, and trig functions, plus evaluating the slope at a specific point.", gen: () => QL.generateDefinitionExam(8), kind: "mc", isExam: true },
    { num: 104, title: "Tangent & Normal Lines Mock Exam", desc: "8 questions on tangent/normal slopes and line equations across quadratics, a cubic, a rational function, and a radical function, plus finding a horizontal tangent point.", gen: () => QL.generateTangentNormalExam(8), kind: "mc", isExam: true }
  ];

  const bestScores = {}; // in-memory only (no persistence needed for a "randomize every take" quiz)

  let state = { screen: "home" };

  function render() {
    if (state.screen === "home") renderHome();
    else if (state.screen === "quiz") renderQuiz();
    else if (state.screen === "summary") renderSummary();
  }

  function levelCardHtml(lv) {
    const best = bestScores[lv.num];
    return `
        <div class="level-card">
          <h2>${lv.isExam ? "" : `<span class="level-num">${lv.num}</span>`}${escapeHtml(lv.title)}</h2>
          <p>${escapeHtml(lv.desc)}</p>
          ${best ? `<div class="best-score">Best this session: ${best.correct}/${best.total}</div>` : ""}
          <button class="btn-primary" data-start-level="${lv.num}">${lv.isExam ? "Start Exam" : "Start Level " + lv.num}</button>
        </div>`;
  }

  function renderHome() {
    const cardsHtml = LEVELS.map(levelCardHtml).join("");
    const examsHtml = EXAMS.map(levelCardHtml).join("");

    app.innerHTML = `
      <header class="site-header">
        <div class="badge">Randomized Every Attempt</div>
        <h1>Calculus Practice Quiz</h1>
        <p>5 derivative levels, from plain multiple choice to 3-layer combined derivatives — plus topic-specific mock exams</p>
      </header>
      <div class="level-grid">${cardsHtml}</div>
      <h2 class="section-heading">Mock Exams</h2>
      <div class="level-grid">${examsHtml}</div>
      <footer class="site-footer">Standalone quiz &middot; works fully offline &middot; refresh or retry for a brand-new random set every time &middot; <a href="./Calculus-Midterm-Reviewer-Corrected.pdf" target="_blank" rel="noopener" style="color:inherit;">Download the full reviewer PDF</a></footer>
    `;

    app.querySelectorAll("[data-start-level]").forEach(btn => {
      btn.addEventListener("click", () => startLevel(parseInt(btn.dataset.startLevel, 10)));
    });
  }

  function startLevel(num) {
    const lv = LEVELS.find(l => l.num === num) || EXAMS.find(e => e.num === num);
    const questions = lv.gen();
    state = {
      screen: "quiz",
      level: lv,
      questions,
      index: 0,
      correctCount: 0,
      // level-1 matching state:
      matchedCount: 0,
      selectedFuncIdx: null,
      derivOrder: null,
      matchedFuncIdxs: new Set(),
      matchedDerivIdxs: new Set(),
      attempts: 0,
      // blanks state:
      checked: false,
      questionCorrect: null,
      selectedAnswers: {}, // blankIdx -> chosen option index, for the CURRENT question
      // level-0 multiple-choice state:
      mcAnswered: false,
      mcChosenIndex: null
    };
    render();
  }

  function renderQuiz() {
    const lv = state.level;
    if (lv.kind === "match") { renderMatchLevel(); return; }
    if (lv.kind === "mc") { renderMcLevel(); return; }
    renderBlanksLevel();
  }

  function renderTopbar(progressCurrent, progressTotal, extraInfo) {
    const pct = Math.round((progressCurrent / progressTotal) * 100);
    const label = state.level.isExam ? escapeHtml(state.level.title) : `Level ${state.level.num}: ${escapeHtml(state.level.title)}`;
    return `
      <div class="quiz-topbar">
        <button class="btn-ghost home-link" data-go-home>&larr; Home</button>
        <div class="info"><b>${label}</b> &nbsp;|&nbsp; ${extraInfo}</div>
      </div>
      <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    `;
  }

  // ---------------- LEVEL 1: Matching ----------------
  function renderMatchLevel() {
    if (state.derivOrder === null) {
      state.derivOrder = shuffleIdx(state.questions.length);
    }
    const total = state.questions.length;
    const topbar = renderTopbar(state.matchedCount, total, `Matched ${state.matchedCount}/${total} &nbsp;|&nbsp; Attempts: ${state.attempts}`);

    const leftCards = state.questions.map((q, i) => {
      const isMatched = state.matchedFuncIdxs.has(i);
      const isSelected = state.selectedFuncIdx === i;
      return `<button class="match-card ${isMatched ? "matched" : ""} ${isSelected ? "selected" : ""}" data-func-idx="${i}" ${isMatched ? "disabled" : ""}>${escapeHtml(q.fLabel)}</button>`;
    }).join("");

    const rightCards = state.derivOrder.map((qIdx) => {
      const isMatched = state.matchedDerivIdxs.has(qIdx);
      return `<button class="match-card ${isMatched ? "matched" : ""}" data-deriv-idx="${qIdx}" ${isMatched ? "disabled" : ""}>${escapeHtml(state.questions[qIdx].dLabel)}</button>`;
    }).join("");

    app.innerHTML = `
      ${topbar}
      <div class="question-card">
        <div class="qtag">Click a function, then click its derivative</div>
        <div class="match-grid">
          <div class="match-col"><h3>Functions</h3>${leftCards}</div>
          <div class="match-col"><h3>Derivatives</h3>${rightCards}</div>
        </div>
        <div id="match-feedback"></div>
      </div>
    `;

    app.querySelector("[data-go-home]").addEventListener("click", goHome);

    app.querySelectorAll("[data-func-idx]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.selectedFuncIdx = parseInt(btn.dataset.funcIdx, 10);
        renderMatchLevel();
      });
    });
    app.querySelectorAll("[data-deriv-idx]").forEach(btn => {
      btn.addEventListener("click", () => {
        const derivIdx = parseInt(btn.dataset.derivIdx, 10);
        if (state.selectedFuncIdx === null) return;
        state.attempts++;
        if (state.selectedFuncIdx === derivIdx) {
          state.matchedFuncIdxs.add(derivIdx);
          state.matchedDerivIdxs.add(derivIdx);
          state.matchedCount++;
          state.selectedFuncIdx = null;
          if (state.matchedCount === state.questions.length) {
            state.correctCount = state.questions.length; // all matched eventually
            setTimeout(() => goSummary(), 400);
            renderMatchLevel();
            return;
          }
          renderMatchLevel();
        } else {
          const fbtn = app.querySelector(`[data-func-idx="${state.selectedFuncIdx}"]`);
          fbtn.classList.add("wrong-flash");
          btn.classList.add("wrong-flash");
          setTimeout(() => {
            state.selectedFuncIdx = null;
            renderMatchLevel();
          }, 500);
        }
      });
    });
  }

  // ---------------- LEVEL 0: plain multiple choice ----------------
  // =========================================================================
  // SVG DIAGRAMS: shape renders (shown WITH the question — generic geometry
  // only, illustrative marker positions, never the actual optimized value)
  // and function/tangent graphs (shown only AFTER answering, since the plot
  // literally draws the answer — a critical point or a tangent/normal line).
  // =========================================================================
  const GRAPH_W = 260, GRAPH_H = 150, GRAPH_PAD = 22;

  function samplePoints(fn, xMin, xMax, n) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const x = xMin + (xMax - xMin) * i / n;
      let y;
      try { y = fn(x); } catch (e) { y = NaN; }
      pts.push([x, y]);
    }
    return pts.filter(p => Number.isFinite(p[1]));
  }

  function toPixels(pts, xMin, xMax, yMin, yMax) {
    const xr = (xMax - xMin) || 1, yr = (yMax - yMin) || 1;
    return pts.map(([x, y]) => [
      GRAPH_PAD + (x - xMin) / xr * (GRAPH_W - 2 * GRAPH_PAD),
      GRAPH_H - GRAPH_PAD - (y - yMin) / yr * (GRAPH_H - 2 * GRAPH_PAD)
    ]);
  }

  function pathFrom(pxPts) {
    return pxPts.map(([x, y], i) => (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1)).join(" ");
  }

  // =========================================================================
  // SWEEP ANIMATIONS.
  // Every animated panel drives ONE parameter t across its feasible range,
  // walks back to the answer t*, and parks there for ~1s — so the last frame a
  // student sees is always the correct configuration (same "hold the answer"
  // contract as the mistake pop-ups' ANSWER_HOLD_MS).
  // =========================================================================
  const SWEEP_DUR = "5.2s";
  const SWEEP_STEPS = 22;
  const SWEEP_HOLD = 12;                 // repeated identical frames == a pause
  let svgUid = 0;
  const f1 = v => (Number.isFinite(v) ? Math.round(v * 10) / 10 : 0);

  function sweepTs(tMin, tMax, tStar) {
    const ts = [], step = (tMax - tMin) / SWEEP_STEPS;
    for (let i = 0; i <= SWEEP_STEPS; i++) ts.push(tMin + step * i);
    for (let i = SWEEP_STEPS - 1; i >= 0; i--) {
      const t = tMin + step * i;
      ts.push(t);
      if (t <= tStar) break;
    }
    for (let i = 0; i < SWEEP_HOLD; i++) ts.push(tStar);
    return ts;
  }

  // SMIL values-list animation. A non-finite sample (a shape degenerating at a
  // domain endpoint, f(x) blowing up near an asymptote) is carried over from the
  // last good frame rather than emitted as "NaN", which would void the whole
  // animation element and freeze the panel.
  function animAttr(attr, vals) {
    let last = 0;
    const cleaned = vals.map(v => {
      if (typeof v === "string") return v;
      if (!Number.isFinite(v)) return last.toFixed(2);
      last = v;
      return v.toFixed(2);
    });
    return `<animate attributeName="${attr}" values="${cleaned.join(";")}" dur="${SWEEP_DUR}" repeatCount="indefinite" calcMode="linear" />`;
  }

  // holds an element invisible until the sweep parks on the answer
  function animFadeIn() {
    return `<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.82;1" dur="${SWEEP_DUR}" repeatCount="indefinite" />`;
  }

  // f(x) (blue) and f'(x) (orange) plotted together, each independently
  // y-scaled to fill the box; a dashed guide marks the critical point x*
  // (where f'=0) with a dot landing on both curves — the visual punchline of
  // every optimization problem: "the derivative's zero IS the answer."
  // animated=true adds a sweeping read-head that drags a dot along each curve
  // and stops dead on x*.
  function functionGraphSvg(g, animated) {
    const N = 48;
    const fPts = samplePoints(g.fn, g.xMin, g.xMax, N);
    const dPts = samplePoints(g.dfn, g.xMin, g.xMax, N);
    if (fPts.length < 2 || dPts.length < 2) return "";
    const fYs = fPts.map(p => p[1]), dYs = dPts.map(p => p[1]);
    const fMin = Math.min(...fYs), fMax = Math.max(...fYs);
    const dMin = Math.min(...dYs), dMax = Math.max(...dYs);
    const fPx = toPixels(fPts, g.xMin, g.xMax, fMin, fMax);
    const dPx = toPixels(dPts, g.xMin, g.xMax, dMin, dMax);
    const X = x => GRAPH_PAD + (x - g.xMin) / ((g.xMax - g.xMin) || 1) * (GRAPH_W - 2 * GRAPH_PAD);
    const Y = (y, lo, hi) => GRAPH_H - GRAPH_PAD - (y - lo) / ((hi - lo) || 1) * (GRAPH_H - 2 * GRAPH_PAD);
    let zeroLine = "";
    if (dMin < 0 && dMax > 0) {
      const zy = Y(0, dMin, dMax);
      zeroLine = `<line x1="${GRAPH_PAD}" y1="${zy.toFixed(1)}" x2="${GRAPH_W - GRAPH_PAD}" y2="${zy.toFixed(1)}" class="fn-zero-line" />`;
    }
    const critXpx = X(g.xStar);
    const critFy = Y(g.fn(g.xStar), fMin, fMax);
    const critDy = Y(g.dfn(g.xStar), dMin, dMax);
    // park the legend wherever the curves aren't: for a max-at-the-left problem
    // a top-left legend box lands squarely on the peak, which is the one point
    // the student needs to see.
    const legY = fPx.concat(dPx).some(([x, y]) => x < 196 && y < 34) ? GRAPH_H - 30 : 2;
    let dots, sweep = "", tail = "";
    if (animated) {
      const ts = sweepTs(g.xMin, g.xMax, g.xStar);
      const xs = ts.map(X);
      const fys = ts.map(t => Y(g.fn(t), fMin, fMax));
      const dys = ts.map(t => Y(g.dfn(t), dMin, dMax));
      sweep = `<line x1="${critXpx.toFixed(1)}" y1="6" x2="${critXpx.toFixed(1)}" y2="${GRAPH_H - 6}" class="fn-sweep-line">${animAttr("x1", xs)}${animAttr("x2", xs)}</line>`;
      dots = `
        <circle cx="${critXpx.toFixed(1)}" cy="${critFy.toFixed(1)}" r="3.6" class="fn-dot-f">${animAttr("cx", xs)}${animAttr("cy", fys)}</circle>
        <circle cx="${critXpx.toFixed(1)}" cy="${critDy.toFixed(1)}" r="3.6" class="fn-dot-df">${animAttr("cx", xs)}${animAttr("cy", dys)}</circle>`;
      tail = `<text x="${GRAPH_W - 6}" y="${GRAPH_H - 6}" class="fn-legend fn-legend-hit" text-anchor="end" opacity="0">f′ = 0 ✓${animFadeIn()}</text>`;
    } else {
      dots = `
        <circle cx="${critXpx.toFixed(1)}" cy="${critFy.toFixed(1)}" r="3.2" class="fn-dot-f" />
        <circle cx="${critXpx.toFixed(1)}" cy="${critDy.toFixed(1)}" r="3.2" class="fn-dot-df" />`;
    }
    return `
      <svg class="fn-graph-svg" viewBox="0 0 ${GRAPH_W} ${GRAPH_H}">
        ${zeroLine}
        <line x1="${critXpx.toFixed(1)}" y1="6" x2="${critXpx.toFixed(1)}" y2="${GRAPH_H - 6}" class="fn-crit-line" />
        ${sweep}
        <path d="${pathFrom(fPx)}" class="fn-curve-f" />
        <path d="${pathFrom(dPx)}" class="fn-curve-df" />
        ${dots}
        ${tail}
        <rect x="0" y="${legY}" width="190" height="28" class="fn-legend-bg" />
        <text x="6" y="${legY + 10}" class="fn-legend fn-legend-f">— ${escapeHtml(g.fnLabel || "f(x)")}</text>
        <text x="6" y="${legY + 24}" class="fn-legend fn-legend-df">— ${escapeHtml(g.dfnLabel || "f′(x)")}</text>
      </svg>`;
  }

  // The curve plus the actual tangent/normal line through (x0, y0) — for the
  // Tangent & Normal Lines exam. Y-range is padded to keep the whole line
  // segment in view even when its slope is steep relative to the curve.
  // animated=true first plays the definition of the derivative itself: a second
  // point Q slides down the curve into P and the SECANT through them rotates
  // into the tangent, after which the real answer line fades in on top.
  function curveLineSvg(g, animated) {
    const N = 48;
    const cPts = samplePoints(g.curveFn, g.xMin, g.xMax, N);
    if (cPts.length < 2) return "";
    const cYs = cPts.map(p => p[1]);
    let yMin = Math.min(...cYs), yMax = Math.max(...cYs);
    g.lines.forEach(line => {
      const y1 = g.y0 + line.slope * (g.xMin - g.x0);
      const y2 = g.y0 + line.slope * (g.xMax - g.x0);
      yMin = Math.min(yMin, y1, y2); yMax = Math.max(yMax, y1, y2);
    });
    if (yMax - yMin < 1e-6) { yMax += 1; yMin -= 1; }
    const cPx = toPixels(cPts, g.xMin, g.xMax, yMin, yMax);
    const X = x => GRAPH_PAD + (x - g.xMin) / ((g.xMax - g.xMin) || 1) * (GRAPH_W - 2 * GRAPH_PAD);
    const Y = y => GRAPH_H - GRAPH_PAD - (y - yMin) / ((yMax - yMin) || 1) * (GRAPH_H - 2 * GRAPH_PAD);
    const x0px = X(g.x0), y0px = Y(g.y0);
    const lineSvgs = g.lines.map(line => {
      const y1 = g.y0 + line.slope * (g.xMin - g.x0);
      const y2 = g.y0 + line.slope * (g.xMax - g.x0);
      const pxPts = toPixels([[g.xMin, y1], [g.xMax, y2]], g.xMin, g.xMax, yMin, yMax);
      const cls = line.type === "normal" ? "fn-line-normal" : "fn-line-tangent";
      return `<path d="${pathFrom(pxPts)}" class="${cls}" ${animated ? 'opacity="0"' : ""}>${animated ? animFadeIn() : ""}</path>`;
    }).join("");
    const primaryType = g.lines[0].type;
    const legY = cPx.some(([x, y]) => x < 116 && y < 34) ? GRAPH_H - 30 : 2;
    const uid = "clip" + (++svgUid);
    let secant = "";
    if (animated) {
      const roomR = g.xMax - g.x0, roomL = g.x0 - g.xMin;
      const side = roomR >= roomL ? 1 : -1;
      const room = Math.max(roomR, roomL);
      const hEnd = room * 0.02, hMax = room * 0.8;
      const hs = [];
      for (let i = 0; i <= SWEEP_STEPS; i++) {
        const u = i / SWEEP_STEPS;
        hs.push(hEnd + (hMax - hEnd) * (1 - u) * (1 - u));   // eases INTO the limit
      }
      for (let i = 0; i < SWEEP_HOLD + 6; i++) hs.push(hEnd);
      const qxs = hs.map(h => g.x0 + side * h);
      const qys = qxs.map(x => g.curveFn(x));
      const ms = qxs.map((x, i) => (qys[i] - g.y0) / ((x - g.x0) || 1e-9));
      secant = `
        <line x1="${GRAPH_PAD}" y1="0" x2="${GRAPH_W - GRAPH_PAD}" y2="0" class="fn-line-secant">${animAttr("y1", ms.map(m => Y(g.y0 + m * (g.xMin - g.x0))))}${animAttr("y2", ms.map(m => Y(g.y0 + m * (g.xMax - g.x0))))}</line>
        <circle cx="0" cy="0" r="3.2" class="fn-dot-q">${animAttr("cx", qxs.map(X))}${animAttr("cy", qys.map(Y))}</circle>
        <text x="${GRAPH_W - 6}" y="${GRAPH_H - 6}" class="fn-legend fn-legend-secant" text-anchor="end">Q → P: secant → tangent</text>`;
    }
    return `
      <svg class="fn-graph-svg" viewBox="0 0 ${GRAPH_W} ${GRAPH_H}">
        <defs><clipPath id="${uid}"><rect x="1" y="1" width="${GRAPH_W - 2}" height="${GRAPH_H - 2}" /></clipPath></defs>
        <g clip-path="url(#${uid})">
          <path d="${pathFrom(cPx)}" class="fn-curve-f" />
          ${secant}
          ${lineSvgs}
        </g>
        <circle cx="${x0px.toFixed(1)}" cy="${y0px.toFixed(1)}" r="3.4" class="fn-dot-f" />
        <rect x="0" y="${legY}" width="110" height="28" class="fn-legend-bg" />
        <text x="6" y="${legY + 10}" class="fn-legend fn-legend-f">— f(x)</text>
        <text x="6" y="${legY + 24}" class="fn-legend ${primaryType === "normal" ? "fn-legend-normal" : "fn-legend-tangent"}">— ${primaryType === "normal" ? "normal line" : "tangent line"}</text>
      </svg>`;
  }

  function graphSvgFor(q, animated) {
    if (!q.graph) return "";
    if (q.graph.kind === "fn-deriv") return functionGraphSvg(q.graph, animated);
    if (q.graph.kind === "curve-line") return curveLineSvg(q.graph, animated);
    return "";
  }

  // =========================================================================
  // SHAPE DIAGRAMS (Optimization exam).
  // One geometry function per shape, rendered in two modes:
  //   * static  (ts omitted)  — drawn WITH the question at an illustrative,
  //     deliberately NON-optimal parameter, so it never leaks the answer;
  //   * animated (ts = sweep) — drawn AFTER answering, sweeping the parameter
  //     across its feasible range and parking on the optimum.
  // Crucially, every INNER object's dimensions are computed from the problem's
  // own constraint equation (w = B(1 − y/H) for the inscribed rectangle,
  // r = R(1 − h/H) for the inscribed cylinder, and so on), so the inner object
  // is always genuinely inside its container instead of being eyeballed.
  // =========================================================================

  function shapeSumOfSquares(s, ts) {
    const W = 240, H = 130, pad = 22, lineY = 34, baseY = 116, sqMax = 46;
    const x1 = pad, x2 = W - pad, span = x2 - x1;
    const geo = t => {
      const f = Math.max(0, Math.min(1, t / s.S));
      const split = x1 + span * f;
      const a = sqMax * f, b = sqMax * (1 - f);
      return {
        split, a, b, la: (x1 + split) / 2, lb: (split + x2) / 2,
        ax: 116 - a, ay: baseY - a, by: baseY - b
      };
    };
    const ill = geo(s.S * 0.3);
    const A = (attr, fn) => (ts ? animAttr(attr, ts.map(t => fn(geo(t)))) : "");
    return `
      <svg class="diagram-svg" viewBox="0 0 ${W} ${H}">
        <line x1="${x1}" y1="${lineY}" x2="${x2}" y2="${lineY}" class="diag-line" />
        <line x1="${x1}" y1="${lineY - 8}" x2="${x1}" y2="${lineY + 8}" class="diag-tick" />
        <line x1="${x2}" y1="${lineY - 8}" x2="${x2}" y2="${lineY + 8}" class="diag-tick" />
        <line x1="${f1(ill.split)}" y1="${lineY - 12}" x2="${f1(ill.split)}" y2="${lineY + 12}" class="diag-tick diag-tick-accent">${A("x1", g => g.split)}${A("x2", g => g.split)}</line>
        <text x="${f1(ill.la)}" y="${lineY - 16}" class="diag-label" text-anchor="middle">x${A("x", g => g.la)}</text>
        <text x="${f1(ill.lb)}" y="${lineY - 16}" class="diag-label" text-anchor="middle">S − x${A("x", g => g.lb)}</text>
        <rect x="${f1(ill.ax)}" y="${f1(ill.ay)}" width="${f1(ill.a)}" height="${f1(ill.a)}" class="diag-rect diag-rect-fill">${A("x", g => g.ax)}${A("y", g => g.ay)}${A("width", g => g.a)}${A("height", g => g.a)}</rect>
        <rect x="124" y="${f1(ill.by)}" width="${f1(ill.b)}" height="${f1(ill.b)}" class="diag-rect diag-rect-fill">${A("y", g => g.by)}${A("width", g => g.b)}${A("height", g => g.b)}</rect>
        <text x="${W / 2}" y="${H - 4}" class="diag-label diag-label-muted" text-anchor="middle">sum = ${s.S} — the two squares are x² and (S−x)²</text>
      </svg>`;
  }

  // x = each side perpendicular to the river, y = P − 2x along it.
  function shapeFenceRiver(s, ts) {
    const W = 240, H = 140, cx = 120, riverY = 36, maxH = 74, maxW = 168;
    const P = s.P;
    const geo = t => {
      const h = maxH * (t / (P / 2)), w = maxW * ((P - 2 * t) / P);
      return { h, w, left: cx - w / 2, right: cx + w / 2, bot: riverY + h };
    };
    const ill = geo((P / 2) * 0.3);
    const A = (attr, fn) => (ts ? animAttr(attr, ts.map(t => fn(geo(t)))) : "");
    return `
      <svg class="diagram-svg" viewBox="0 0 ${W} ${H}">
        <path d="M14,${riverY - 10} q10,-8 20,0 q10,8 20,0 q10,-8 20,0 q10,8 20,0 q10,-8 20,0 q10,8 20,0 q10,-8 20,0 q10,8 20,0 q10,-8 14,0" class="diag-river" />
        <text x="${cx}" y="${riverY - 16}" class="diag-label diag-label-muted" text-anchor="middle">river (no fence)</text>
        <rect x="${f1(ill.left)}" y="${riverY}" width="${f1(ill.w)}" height="${f1(ill.h)}" class="diag-rect-fill diag-rect-nostroke">${A("x", g => g.left)}${A("width", g => g.w)}${A("height", g => g.h)}</rect>
        <line x1="${f1(ill.left)}" y1="${riverY}" x2="${f1(ill.left)}" y2="${f1(ill.bot)}" class="diag-line">${A("x1", g => g.left)}${A("x2", g => g.left)}${A("y2", g => g.bot)}</line>
        <line x1="${f1(ill.right)}" y1="${riverY}" x2="${f1(ill.right)}" y2="${f1(ill.bot)}" class="diag-line">${A("x1", g => g.right)}${A("x2", g => g.right)}${A("y2", g => g.bot)}</line>
        <line x1="${f1(ill.left)}" y1="${f1(ill.bot)}" x2="${f1(ill.right)}" y2="${f1(ill.bot)}" class="diag-line">${A("x1", g => g.left)}${A("x2", g => g.right)}${A("y1", g => g.bot)}${A("y2", g => g.bot)}</line>
        <text x="${f1(ill.left - 10)}" y="${f1(riverY + ill.h / 2)}" class="diag-label" text-anchor="middle">x${A("x", g => g.left - 10)}${A("y", g => riverY + g.h / 2)}</text>
        <text x="${cx}" y="${f1(ill.bot + 14)}" class="diag-label" text-anchor="middle">y = P − 2x${A("y", g => g.bot + 14)}</text>
        <text x="${cx}" y="${H - 4}" class="diag-label diag-label-muted" text-anchor="middle">fence total = ${s.P} m</text>
      </svg>`;
  }

  // 3 lots: total fence P = 2W + 4h, so W = (P − 4h)/2 for a chosen height h.
  function shapeThreeLotFence(s, ts) {
    const W = 240, H = 136, cx = 120, bot = 98, maxH = 70, maxW = 176;
    const P = s.P;
    const geo = t => {
      const h = maxH * (t / (P / 4)), w = maxW * ((P - 4 * t) / P);
      return { h, w, left: cx - w / 2, top: bot - h, d1: cx - w / 6, d2: cx + w / 6 };
    };
    const ill = geo((P / 4) * 0.32);
    const A = (attr, fn) => (ts ? animAttr(attr, ts.map(t => fn(geo(t)))) : "");
    return `
      <svg class="diagram-svg" viewBox="0 0 ${W} ${H}">
        <rect x="${f1(ill.left)}" y="${f1(ill.top)}" width="${f1(ill.w)}" height="${f1(ill.h)}" class="diag-rect diag-rect-fill">${A("x", g => g.left)}${A("y", g => g.top)}${A("width", g => g.w)}${A("height", g => g.h)}</rect>
        <line x1="${f1(ill.d1)}" y1="${f1(ill.top)}" x2="${f1(ill.d1)}" y2="${bot}" class="diag-line diag-line-inner">${A("x1", g => g.d1)}${A("x2", g => g.d1)}${A("y1", g => g.top)}</line>
        <line x1="${f1(ill.d2)}" y1="${f1(ill.top)}" x2="${f1(ill.d2)}" y2="${bot}" class="diag-line diag-line-inner">${A("x1", g => g.d2)}${A("x2", g => g.d2)}${A("y1", g => g.top)}</line>
        <text x="${cx}" y="${bot + 15}" class="diag-label" text-anchor="middle">W = (P − 4h)/2</text>
        <text x="${f1(ill.left - 12)}" y="${f1(bot - ill.h / 2)}" class="diag-label" text-anchor="middle">h${A("x", g => g.left - 12)}${A("y", g => bot - g.h / 2)}</text>
        <text x="${cx}" y="${H - 4}" class="diag-label diag-label-muted" text-anchor="middle">fence total = ${s.P} ft (2 outer widths + 4 heights)</text>
      </svg>`;
  }

  // Flat sheet with x-by-x corner cuts, next to the box it folds into:
  // base (L−2x) by (W−2x), height x — drawn in isometric projection.
  function shapeBoxCutting(s, ts) {
    const Wv = 240, Hv = 150, sx = 12, sy = 30;
    const L = s.L, Wd = s.W;
    const pxPerUnit = Math.min(92 / L, 78 / Wd);   // fit BOTH dimensions: sheets are often far from square
    const sheetW = L * pxPerUnit, sheetH = Wd * pxPerUnit;
    const isoScale = 78 / ((L + Wd) * 0.866);
    const iso = (X, Y, Z) => [(X - Z) * 0.866 * isoScale, ((X + Z) * 0.5 - Y) * isoScale];
    const geo = t => {
      const cut = t * pxPerUnit;
      const a = L - 2 * t, b = Wd - 2 * t, hgt = t;
      const c = iso(a / 2, 0, b / 2);
      const ox = 172 - c[0], oy = 92 - c[1];
      const P = (X, Y, Z) => { const p = iso(X, Y, Z); return (p[0] + ox).toFixed(1) + "," + (p[1] + oy).toFixed(1); };
      return {
        cut,
        top: [P(0, hgt, 0), P(a, hgt, 0), P(a, hgt, b), P(0, hgt, b)].join(" "),
        right: [P(a, hgt, 0), P(a, hgt, b), P(a, 0, b), P(a, 0, 0)].join(" "),
        front: [P(0, hgt, b), P(a, hgt, b), P(a, 0, b), P(0, 0, b)].join(" ")
      };
    };
    const ill = geo(Math.min(L, Wd) / 2 * 0.3);
    const A = (attr, fn) => (ts ? animAttr(attr, ts.map(t => fn(geo(t)))) : "");
    const corner = (cxp, cyp, ax, ay) => `<rect x="${cxp}" y="${cyp}" width="${f1(ill.cut)}" height="${f1(ill.cut)}" class="diag-cut">${A("width", g => g.cut)}${A("height", g => g.cut)}${ax ? A("x", g => ax(g)) : ""}${ay ? A("y", g => ay(g)) : ""}</rect>`;
    return `
      <svg class="diagram-svg" viewBox="0 0 ${Wv} ${Hv}">
        <rect x="${sx}" y="${sy}" width="${f1(sheetW)}" height="${f1(sheetH)}" class="diag-rect" />
        ${corner(sx, sy, null, null)}
        ${corner(f1(sx + sheetW - ill.cut), sy, g => sx + sheetW - g.cut, null)}
        ${corner(sx, f1(sy + sheetH - ill.cut), null, g => sy + sheetH - g.cut)}
        ${corner(f1(sx + sheetW - ill.cut), f1(sy + sheetH - ill.cut), g => sx + sheetW - g.cut, g => sy + sheetH - g.cut)}
        <text x="${f1(Math.max(sx + sheetW / 2, 50))}" y="${sy - 8}" class="diag-label diag-label-tiny" text-anchor="middle">${s.L} × ${s.W} sheet, cut x</text>
        <polygon points="${ill.front}" class="diag-iso-side">${A("points", g => g.front)}</polygon>
        <polygon points="${ill.right}" class="diag-iso-side-dark">${A("points", g => g.right)}</polygon>
        <polygon points="${ill.top}" class="diag-iso-top">${A("points", g => g.top)}</polygon>
        <text x="172" y="${Hv - 16}" class="diag-label diag-label-tiny" text-anchor="middle">box: (L−2x)(W−2x)·x</text>
      </svg>`;
  }

  // print area x by k/x, page (x+2a) by (k/x+2b) — the print block is always
  // exactly inset by the given margins.
  function shapePageMargins(s, ts) {
    const Wv = 240, Hv = 150, cx = 120, cy = 74;
    const a = s.a, b = s.b, k = s.k;
    const xStar = Math.sqrt(a * k / b);
    const probe = ts || [xStar * 0.5, xStar, xStar * 2];
    let maxW = 0, maxH = 0;
    probe.forEach(t => {
      maxW = Math.max(maxW, t + 2 * a);
      maxH = Math.max(maxH, k / t + 2 * b);
    });
    const sc = Math.min(112 / maxW, 108 / maxH);
    const geo = t => {
      const pw = (t + 2 * a) * sc, ph = (k / t + 2 * b) * sc;
      return {
        pw, ph, px: cx - pw / 2, py: cy - ph / 2,
        iw: t * sc, ih: (k / t) * sc, ix: cx - pw / 2 + a * sc, iy: cy - ph / 2 + b * sc
      };
    };
    const ill = geo(xStar * 1.8);
    const A = (attr, fn) => (ts ? animAttr(attr, ts.map(t => fn(geo(t)))) : "");
    return `
      <svg class="diagram-svg" viewBox="0 0 ${Wv} ${Hv}">
        <rect x="${f1(ill.px)}" y="${f1(ill.py)}" width="${f1(ill.pw)}" height="${f1(ill.ph)}" class="diag-rect">${A("x", g => g.px)}${A("y", g => g.py)}${A("width", g => g.pw)}${A("height", g => g.ph)}</rect>
        <rect x="${f1(ill.ix)}" y="${f1(ill.iy)}" width="${f1(ill.iw)}" height="${f1(ill.ih)}" class="diag-rect diag-rect-fill">${A("x", g => g.ix)}${A("y", g => g.iy)}${A("width", g => g.iw)}${A("height", g => g.ih)}</rect>
        <text x="${cx}" y="${Hv - 18}" class="diag-label diag-label-tiny" text-anchor="middle">print x by ${k}/x, page (x+${2 * a}) by (${k}/x+${2 * b})</text>
        <text x="${cx}" y="${Hv - 4}" class="diag-label diag-label-muted" text-anchor="middle">margins ${a}in sides, ${b}in top/bottom</text>
      </svg>`;
  }

  // Rectangle inscribed in a triangle: similar triangles force its width to be
  // w = B(1 − y/H) at height y, so its top corners ride exactly on the sides.
  function shapeInscribedRectangle(s, ts) {
    const Wv = 240, Hv = 142, baseY = 116, apexY = 16, leftX = 26, rightX = 214;
    const cx = (leftX + rightX) / 2, halfBase = (rightX - leftX) / 2, triH = baseY - apexY;
    const geo = t => {
      const frac = Math.max(0, Math.min(1, t / s.H));
      const h = triH * frac;                 // rectangle height  = y
      const half = halfBase * (1 - frac);    // half-width        = B(1 − y/H)/2
      return { h, half, x: cx - half, y: baseY - h, w: 2 * half };
    };
    const ill = geo(s.H * 0.65);
    const A = (attr, fn) => (ts ? animAttr(attr, ts.map(t => fn(geo(t)))) : "");
    return `
      <svg class="diagram-svg" viewBox="0 0 ${Wv} ${Hv}">
        <polygon points="${leftX},${baseY} ${rightX},${baseY} ${cx},${apexY}" class="diag-tri" />
        <rect x="${f1(ill.x)}" y="${f1(ill.y)}" width="${f1(ill.w)}" height="${f1(ill.h)}" class="diag-rect diag-rect-fill">${A("x", g => g.x)}${A("y", g => g.y)}${A("width", g => g.w)}${A("height", g => g.h)}</rect>
        <text x="${cx}" y="${f1(ill.y - 5)}" class="diag-label diag-label-tiny" text-anchor="middle">w${A("y", g => g.y - 5)}</text>
        <text x="${f1(ill.x - 9)}" y="${f1(baseY - ill.h / 2)}" class="diag-label diag-label-tiny" text-anchor="middle">y${A("x", g => g.x - 9)}${A("y", g => baseY - g.h / 2)}</text>
        <text x="${cx}" y="${baseY + 14}" class="diag-label" text-anchor="middle">B = ${s.B} ft</text>
        <text x="${cx}" y="${Hv - 4}" class="diag-label diag-label-muted" text-anchor="middle">H = ${s.H} ft — w = B(1 − y/H), A = y·w</text>
      </svg>`;
  }

  // Cylinder inscribed in a cone: the cone's cross-section at height h has
  // radius r = R(1 − h/H), so the cylinder's top rim sits exactly ON the slant.
  function shapeConeCylinder(s, ts) {
    const Wv = 240, Hv = 156, cx = 120, apexY = 18, baseY = 116, R = 66, ryBase = 15;
    const coneH = baseY - apexY;
    const geo = t => {
      const frac = Math.max(0, Math.min(1, t / s.H));
      const r = R * (1 - frac);              // r = R(1 − h/H)
      return {
        r, h: coneH * frac, topY: baseY - coneH * frac, ry: ryBase * (1 - frac),
        left: cx - R * (1 - frac), right: cx + R * (1 - frac)
      };
    };
    const ill = geo(s.H * 0.55);
    const A = (attr, fn) => (ts ? animAttr(attr, ts.map(t => fn(geo(t)))) : "");
    return `
      <svg class="diagram-svg" viewBox="0 0 ${Wv} ${Hv}">
        <ellipse cx="${cx}" cy="${baseY}" rx="${R}" ry="${ryBase}" class="diag-ellipse-base" />
        <line x1="${cx}" y1="${apexY}" x2="${cx - R}" y2="${baseY}" class="diag-line" />
        <line x1="${cx}" y1="${apexY}" x2="${cx + R}" y2="${baseY}" class="diag-line" />
        <circle cx="${cx}" cy="${apexY}" r="2.2" class="diag-dot" />
        <rect x="${f1(ill.left)}" y="${f1(ill.topY)}" width="${f1(2 * ill.r)}" height="${f1(ill.h)}" class="diag-rect-fill diag-rect-nostroke">${A("x", g => g.left)}${A("y", g => g.topY)}${A("width", g => 2 * g.r)}${A("height", g => g.h)}</rect>
        <line x1="${f1(ill.left)}" y1="${f1(ill.topY)}" x2="${f1(ill.left)}" y2="${baseY}" class="diag-line diag-line-cyl">${A("x1", g => g.left)}${A("x2", g => g.left)}${A("y1", g => g.topY)}</line>
        <line x1="${f1(ill.right)}" y1="${f1(ill.topY)}" x2="${f1(ill.right)}" y2="${baseY}" class="diag-line diag-line-cyl">${A("x1", g => g.right)}${A("x2", g => g.right)}${A("y1", g => g.topY)}</line>
        <ellipse cx="${cx}" cy="${f1(ill.topY)}" rx="${f1(ill.r)}" ry="${f1(ill.ry)}" class="diag-ellipse-top">${A("cy", g => g.topY)}${A("rx", g => g.r)}${A("ry", g => g.ry)}</ellipse>
        <text x="${cx}" y="${f1(ill.topY - 6)}" class="diag-label diag-label-tiny" text-anchor="middle">r${A("y", g => g.topY - 6)}</text>
        <text x="${f1(ill.left - 10)}" y="${f1(baseY - ill.h / 2)}" class="diag-label diag-label-tiny" text-anchor="middle">h${A("x", g => g.left - 10)}${A("y", g => baseY - g.h / 2)}</text>
        <text x="${cx}" y="${Hv - 18}" class="diag-label" text-anchor="middle">cone R = ${s.R} ft, H = ${s.H} ft</text>
        <text x="${cx}" y="${Hv - 4}" class="diag-label diag-label-muted" text-anchor="middle">V = πr²h = πR²(1 − h/H)²h</text>
      </svg>`;
  }

  // Row to a landing point x along the shore, then walk the remaining L − x.
  function shapeRowboat(s, ts) {
    const Wv = 240, Hv = 142, shoreY = 104, boatX = 28, boatY = 30, destX = 214;
    const geo = t => {
      const land = boatX + (destX - boatX) * (t / s.L);
      return { land, rowMid: (boatX + land) / 2, walkMid: (land + destX) / 2 };
    };
    const ill = geo(s.L * 0.62);
    const A = (attr, fn) => (ts ? animAttr(attr, ts.map(t => fn(geo(t)))) : "");
    return `
      <svg class="diagram-svg" viewBox="0 0 ${Wv} ${Hv}">
        <rect x="6" y="${shoreY}" width="228" height="18" class="diag-shore" />
        <line x1="6" y1="${shoreY}" x2="234" y2="${shoreY}" class="diag-line" />
        <circle cx="${boatX}" cy="${boatY}" r="3.5" class="diag-dot" />
        <text x="${boatX - 4}" y="${boatY - 8}" class="diag-label diag-label-tiny">boat</text>
        <line x1="${boatX}" y1="${boatY}" x2="${boatX}" y2="${shoreY}" class="diag-line diag-line-inner" stroke-dasharray="3,3" />
        <text x="${boatX - 14}" y="${(boatY + shoreY) / 2}" class="diag-label diag-label-tiny">d=${s.d}</text>
        <circle cx="${destX}" cy="${shoreY}" r="3.5" class="diag-dot" />
        <text x="${destX - 6}" y="${shoreY - 8}" class="diag-label diag-label-tiny">dest</text>
        <line x1="${boatX}" y1="${boatY}" x2="${f1(ill.land)}" y2="${shoreY}" class="diag-line diag-line-row">${A("x2", g => g.land)}</line>
        <line x1="${f1(ill.land)}" y1="${shoreY}" x2="${destX}" y2="${shoreY}" class="diag-line diag-line-walk">${A("x1", g => g.land)}</line>
        <circle cx="${f1(ill.land)}" cy="${shoreY}" r="3" class="diag-dot-accent">${A("cx", g => g.land)}</circle>
        <text x="${f1(ill.rowMid + 16)}" y="${(boatY + shoreY) / 2 + 6}" class="diag-label diag-label-tiny" text-anchor="middle">row${A("x", g => g.rowMid + 16)}</text>
        <text x="${f1(ill.walkMid)}" y="${shoreY + 14}" class="diag-label diag-label-tiny" text-anchor="middle">walk${A("x", g => g.walkMid)}</text>
        <text x="${Wv / 2}" y="${Hv - 4}" class="diag-label diag-label-muted" text-anchor="middle">land x along shore, then walk L − x</text>
      </svg>`;
  }

  function shapeSvgFor(shape, ts) {
    switch (shape.type) {
      case "sumOfSquares": return shapeSumOfSquares(shape, ts);
      case "fenceRiver": return shapeFenceRiver(shape, ts);
      case "threeLotFence": return shapeThreeLotFence(shape, ts);
      case "boxCutting": return shapeBoxCutting(shape, ts);
      case "pageMargins": return shapePageMargins(shape, ts);
      case "inscribedRectangle": return shapeInscribedRectangle(shape, ts);
      case "coneCylinder": return shapeConeCylinder(shape, ts);
      case "rowboat": return shapeRowboat(shape, ts);
      default: return "";
    }
  }

  // The post-answer panel: the shape and the graph sweep the SAME parameter in
  // lockstep (identical ts list, identical 5.2s loop), so a student can watch
  // "geometry changes -> objective curve moves -> derivative crosses zero"
  // as one continuous story instead of three separate pictures.
  function solutionPanelHtml(q) {
    if (!q.graph) return "";
    const isFn = q.graph.kind === "fn-deriv";
    const ts = isFn ? sweepTs(q.graph.xMin, q.graph.xMax, q.graph.xStar) : null;
    const shapeHtml = (isFn && q.shape) ? shapeSvgFor(q.shape, ts) : "";
    const graphHtml = graphSvgFor(q, true);
    if (!shapeHtml && !graphHtml) return "";
    const title = isFn
      ? "watch it move — the best shape is where f′ hits 0"
      : "watch the secant collapse onto the tangent";
    return `<div class="q-graph">
        <div class="q-graph-title">${title}</div>
        <div class="anim-pair">${shapeHtml}${graphHtml}</div>
      </div>`;
  }

  function renderMcLevel() {
    const q = state.questions[state.index];
    const total = state.questions.length;
    const topbar = renderTopbar(state.index, total, `Question ${state.index + 1}/${total} &nbsp;|&nbsp; Score: ${state.correctCount}/${state.index}`);

    const optionsHtml = q.options.map((opt, i) => {
      let cls = "";
      if (state.mcAnswered) {
        if (i === q.correctIndex) cls = "correct";
        else if (i === state.mcChosenIndex) cls = "incorrect";
        else cls = "dimmed";
      }
      return `<button class="mc-option ${cls}" data-opt-idx="${i}" ${state.mcAnswered ? "disabled" : ""}>${escapeHtml(opt)}</button>`;
    }).join("");

    app.innerHTML = `
      ${topbar}
      <div class="question-card">
        <div class="qtag">Question ${state.index + 1} of ${total}</div>
        <div class="question-prompt">${escapeHtml(q.fLabel)}</div>
        ${q.shape ? `<div class="q-diagram">${shapeSvgFor(q.shape)}</div>` : ""}
        <div class="mc-options">${optionsHtml}</div>
        <div class="actions-row">
          ${state.mcAnswered
            ? `<button class="btn-primary" data-next>${state.index + 1 < total ? "Next Question →" : "See Results"}</button>`
            : ""}
          <button class="btn-ghost" data-go-home>Exit to Menu</button>
        </div>
        ${state.mcAnswered ? `<div class="feedback-msg ${q.correctIndex === state.mcChosenIndex ? "correct" : "incorrect"}">${q.correctIndex === state.mcChosenIndex ? "✓ Correct!" : "✗ Not quite — the correct answer is highlighted."}</div>` : ""}
        ${state.mcAnswered && q.graph ? solutionPanelHtml(q) : ""}
      </div>
    `;

    app.querySelector("[data-go-home]").addEventListener("click", goHome);

    if (state.mcAnswered) {
      app.querySelector("[data-next]").addEventListener("click", () => {
        state.index++;
        state.mcAnswered = false;
        state.mcChosenIndex = null;
        if (state.index >= total) { goSummary(); return; }
        render();
      });
    } else {
      app.querySelectorAll("[data-opt-idx]").forEach(btn => {
        btn.addEventListener("click", () => {
          const chosen = parseInt(btn.dataset.optIdx, 10);
          state.mcChosenIndex = chosen;
          state.mcAnswered = true;
          const isCorrect = chosen === q.correctIndex;
          if (isCorrect) {
            state.correctCount++;
          } else {
            showMcMistakePopup(q);
          }
          render();
        });
      });
    }
  }

  function showMcMistakePopup(q) {
    if (mistakePopupActive) return;
    mistakePopupActive = true;

    const flash = document.createElement("div");
    flash.className = "hit-flash";
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 550);
    app.classList.add("shake");
    setTimeout(() => app.classList.remove("shake"), 400);

    const bannerWord = MISS_WORDS[Math.floor(Math.random() * MISS_WORDS.length)];
    let innerHtml, loopTimer = null;

    if (q.isConstant) {
      innerHtml = `
        <div class="mistake-banner">${bannerWord}</div>
        <div class="mistake-tag">Constant Rule</div>
        ${constStageHtml(q.constValue)}`;
    } else if (q.isLinear) {
      innerHtml = `
        <div class="mistake-banner">${bannerWord}</div>
        <div class="mistake-tag">Linear Rule</div>
        ${linearStageHtml(q.linearA, q.linearB)}`;
    } else if (q.yPrimeShape) {
      innerHtml = `
        <div class="mistake-banner">${bannerWord}</div>
        <div class="mistake-tag">Don't forget y′</div>
        ${yPrimeStageHtml(q.yPrimeShape.term, q.yPrimeShape.deriv, q.yPrimeShape.tag)}`;
    } else if (q.squeezeShape) {
      innerHtml = `
        <div class="mistake-banner">${bannerWord}</div>
        <div class="mistake-tag">Squeeze Theorem</div>
        ${squeezeStageHtml(q.squeezeShape.lower, q.squeezeShape.middle, q.squeezeShape.upper, q.squeezeShape.answer)}`;
    } else if (q.incrementShape) {
      innerHtml = `
        <div class="mistake-banner">${bannerWord}</div>
        <div class="mistake-tag">Definition of the Derivative</div>
        ${incrStageHtml(escapeHtml(q.options[q.correctIndex]))}`;
    } else if (q.optCritShape) {
      innerHtml = `
        <div class="mistake-banner">${bannerWord}</div>
        <div class="mistake-tag">Reduce to One Variable</div>
        ${optCritStageHtml(escapeHtml(q.options[q.correctIndex]))}`;
    } else if (q.tanNormalShape) {
      innerHtml = `
        <div class="mistake-banner">${bannerWord}</div>
        <div class="mistake-tag">${/normal/i.test(q.fLabel) ? "Normal = " + QL.MINUS + "1/m" : "Differentiate, then Plug In"}</div>
        ${stepsStageHtml(q.tanNormalShape.steps)}`;
    } else {
      innerHtml = `
        <div class="mistake-banner">${bannerWord}</div>
        <div class="reveal-stage"><div class="reveal-answer">${escapeHtml(q.options[q.correctIndex])}</div></div>`;
    }

    const overlay = document.createElement("div");
    overlay.className = "mistake-overlay";
    overlay.innerHTML = `
      <div class="mistake-card">
        ${innerHtml}
        <div class="mistake-hint">tap to continue</div>
      </div>`;
    document.body.appendChild(overlay);

    if (q.isConstant) loopTimer = attachConstAnimation(overlay);
    else if (q.isLinear) loopTimer = attachLinearAnimation(overlay);
    else if (q.yPrimeShape) loopTimer = attachYPrimeAnimation(overlay);
    else if (q.squeezeShape) loopTimer = attachSqueezeAnimation(overlay);
    else if (q.incrementShape) loopTimer = attachIncrAnimation(overlay);
    else if (q.optCritShape) loopTimer = attachOptCritAnimation(overlay);
    else if (q.tanNormalShape) loopTimer = attachStepsAnimation(overlay);

    let dismissed = false;
    function dismiss() {
      if (dismissed) return;
      dismissed = true;
      if (loopTimer) clearInterval(loopTimer);
      overlay.style.transition = "opacity 0.12s ease-in";
      overlay.style.opacity = "0";
      setTimeout(() => { overlay.remove(); mistakePopupActive = false; }, 130);
    }
    overlay.addEventListener("click", dismiss);
  }

  function shuffleIdx(n) {
    const a = Array.from({ length: n }, (_, i) => i);
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------------- LEVELS 2-4: Fill-in-the-blank ----------------
  function renderBlanksLevel() {
    const q = state.questions[state.index];
    const total = state.questions.length;
    const topbar = renderTopbar(state.index, total, `Question ${state.index + 1}/${total} &nbsp;|&nbsp; Score: ${state.correctCount}/${state.index}`);

    const templateHtml = renderTemplate(q.renderTemplate, q.blanks, state.checked, state.selectedAnswers);

    app.innerHTML = `
      ${topbar}
      <div class="question-card">
        <div class="qtag">Question ${state.index + 1} of ${total}</div>
        <div class="question-prompt">${q.renderPrompt}</div>
        ${q.hint ? `<div class="question-hint">💡 ${escapeHtml(q.hint)}</div>` : ""}
        <div class="template-line">${templateHtml}</div>
        <div class="actions-row">
          ${state.checked
            ? `<button class="btn-primary" data-next>${state.index + 1 < total ? "Next Question →" : "See Results"}</button>`
            : `<button class="btn-primary" data-check>Check Answer</button>`}
          <button class="btn-ghost" data-go-home>Exit to Menu</button>
        </div>
        ${state.checked ? `<div class="feedback-msg ${state.questionCorrect ? "correct" : "incorrect"}">${state.questionCorrect ? "✓ Correct!" : "✗ Not quite — review the highlighted blanks."}</div>` : ""}
      </div>
    `;

    app.querySelector("[data-go-home]").addEventListener("click", goHome);

    if (!state.checked) {
      // live-track selections so a mid-question re-render (there isn't one today,
      // but this keeps state authoritative) and the eventual Check-time render
      // both reflect exactly what the student picked.
      app.querySelectorAll("select.blank").forEach(sel => {
        sel.addEventListener("change", () => {
          const blankIdx = parseInt(sel.dataset.blankIdx, 10);
          const chosen = sel.value === "" ? undefined : parseInt(sel.value, 10);
          state.selectedAnswers[blankIdx] = chosen;
          const blank = q.blanks[blankIdx];
          if (chosen !== undefined && chosen !== blank.correctIndex) {
            showMistakePopup(sel, blank, q);
          }
        });
      });
    }

    if (state.checked) {
      app.querySelector("[data-next]").addEventListener("click", () => {
        state.index++;
        state.checked = false;
        state.questionCorrect = null;
        state.selectedAnswers = {};
        if (state.index >= total) { goSummary(); return; }
        render();
      });
    } else {
      app.querySelector("[data-check]").addEventListener("click", () => {
        const selects = app.querySelectorAll("select.blank");
        let allAnswered = true;
        selects.forEach(sel => { if (sel.value === "") allAnswered = false; });
        if (!allAnswered) {
          alert("Please answer every blank before checking.");
          return;
        }
        let allCorrect = true;
        selects.forEach(sel => {
          const blankIdx = parseInt(sel.dataset.blankIdx, 10);
          const chosen = parseInt(sel.value, 10);
          state.selectedAnswers[blankIdx] = chosen;
          if (chosen !== q.blanks[blankIdx].correctIndex) allCorrect = false;
        });
        state.checked = true;
        state.questionCorrect = allCorrect;
        if (allCorrect) state.correctCount++;
        render();
      });
    }
  }

  // Parses a template string like "f′(x) = {b1} · x{b2:sup}" into HTML with <select> blanks.
  // selectedAnswers maps blankIdx -> chosen option index for THIS question, so that a
  // full re-render after "Check" still shows what the student picked (with correct/
  // incorrect coloring) instead of resetting the dropdowns to their default option.
  function renderTemplate(tmpl, blanks, checked, selectedAnswers) {
    const blankByKey = {};
    blanks.forEach((b, i) => { blankByKey[b.key] = { ...b, idx: i }; });
    const filled = tmpl.replace(/\{(\w+)(:sup)?\}/g, (match, key, supFlag) => {
      const b = blankByKey[key];
      if (!b) return match;
      const chosenIdx = selectedAnswers[b.idx];
      const isCorrect = checked && chosenIdx === b.correctIndex;
      const isIncorrect = checked && chosenIdx !== undefined && chosenIdx !== b.correctIndex;
      const stateClass = (isCorrect ? "correct" : (isIncorrect ? "incorrect" : "")) + (supFlag ? " blank-sup" : "");
      const placeholderSelected = chosenIdx === undefined;
      const optsHtml = `<option value="" ${placeholderSelected ? "selected" : ""} disabled hidden>?</option>` +
        b.options.map((opt, oi) => `<option value="${oi}" ${oi === chosenIdx ? "selected" : ""}>${escapeHtml(opt)}</option>`).join("");
      const selHtml = `<select class="blank ${stateClass}" data-blank-idx="${b.idx}" ${checked ? "disabled" : ""}>${optsHtml}</select>`;
      const hintHtml = isIncorrect ? `<span class="correct-hint">✓ ${escapeHtml(b.options[b.correctIndex])}</span>` : "";
      return selHtml + hintHtml;
    });
    // Templates use runs of 3+ literal spaces as an intentional "new sub-step" separator
    // (e.g. "u′ = ...     v′ = ...     f′(x) = ..."). Render each as its own row instead
    // of one long inline string — on narrow screens that string wraps at arbitrary points
    // mid-phrase (a lone dropdown stranded on its own line, disconnected from its label).
    const rows = filled.split(/ {3,}/).filter(r => r.trim().length > 0);
    if (rows.length <= 1) return filled;
    return rows.map(r => `<div class="template-row">${r}</div>`).join("");
  }

  // ---------------- Mistake pop-up (immediate, arcade "took damage" hit) ----------------
  let mistakePopupActive = false;
  const MISS_WORDS = ["MISS!", "OOF!", "NOPE!", "TILT!"];

  function fmtCoefPart(a) {
    if (a === 0) return "0";
    const abs = Math.abs(a);
    return (a < 0 ? QL.MINUS : "") + (abs === 1 ? "" : String(abs));
  }

  // Shared "constant gets obliterated, becomes 0" diagram — used by both the
  // fill-in-the-blank constant-term mistake and Level 0's multiple choice.
  function constStageHtml(cVal) {
    const cDisplay = (cVal < 0 ? QL.MINUS : "+") + Math.abs(cVal);
    return `
      <div class="const-stage">
        <div class="const-num-wrap"><span class="const-num" id="cd-num">${cDisplay}</span></div>
        <div class="const-arrow">↓</div>
        <span class="const-zero" id="cd-zero">0</span>
      </div>`;
  }

  // Every looping mistake animation must HOLD its final answer on screen long
  // enough to actually be read before the loop restarts. cycleMs() computes the
  // loop interval from when the last reveal fires, so the hold is guaranteed
  // rather than accidentally eaten by a hand-tuned interval.
  const ANSWER_HOLD_MS = 1000;                 // full second of the answer sitting still
  const REVEAL_SETTLE_MS = 400;                // matches exp-land-bounce's 0.4s landing
  function cycleMs(finalRevealMs, minCycleMs) {
    return Math.max(finalRevealMs + REVEAL_SETTLE_MS + ANSWER_HOLD_MS, minCycleMs || 0);
  }

  // Generic "work the steps" chain: each line of the derivation drops in one
  // after another, the last one landing as the answer. Rows are laid out (but
  // invisible) from the start so the card never resizes mid-loop.
  function stepsStageHtml(steps) {
    const last = steps.length - 1;
    return `
      <div class="steps-stage">
        ${steps.map((line, i) => `<div class="step-row${i === last ? " step-answer" : ""}">${escapeHtml(line)}</div>`).join("")}
      </div>`;
  }

  const STEP_GAP_MS = 620;
  function attachStepsAnimation(overlay) {
    const rows = Array.prototype.slice.call(overlay.querySelectorAll(".step-row"));
    if (!rows.length) return null;
    const lastAt = 220 + (rows.length - 1) * STEP_GAP_MS;
    function playCycle() {
      rows.forEach(r => r.classList.remove("show"));
      void rows[0].offsetWidth;
      rows.forEach((r, i) => setTimeout(() => r.classList.add("show"), 220 + i * STEP_GAP_MS));
    }
    requestAnimationFrame(playCycle);
    return setInterval(playCycle, cycleMs(lastAt, 2600));
  }

  function attachConstAnimation(overlay) {
    const numEl = overlay.querySelector("#cd-num");
    const zeroEl = overlay.querySelector("#cd-zero");
    const wrap = overlay.querySelector(".const-num-wrap");

    function playConstCycle() {
      wrap.querySelectorAll(".const-frag").forEach(f => f.remove());
      numEl.classList.remove("detonate"); void numEl.offsetWidth;
      zeroEl.classList.remove("reveal");

      setTimeout(() => {
        numEl.classList.add("detonate");
        const fragCount = 8;
        for (let i = 0; i < fragCount; i++) {
          const frag = document.createElement("span");
          frag.className = "const-frag";
          const angle = (Math.PI * 2 * i) / fragCount + (Math.random() * 0.4 - 0.2);
          const dist = 38 + Math.random() * 22;
          frag.style.setProperty("--fx", (Math.cos(angle) * dist) + "px");
          frag.style.setProperty("--fy", (Math.sin(angle) * dist) + "px");
          frag.style.setProperty("--frot", (Math.random() * 360 - 180) + "deg");
          wrap.appendChild(frag);
          requestAnimationFrame(() => frag.classList.add("fly"));
        }
      }, 200);

      setTimeout(() => { zeroEl.classList.add("reveal"); }, 900);
    }

    requestAnimationFrame(playConstCycle);
    return setInterval(playConstCycle, cycleMs(900, 2000));
  }

  // Shared "x and the constant literally fall off, coefficient survives" diagram
  // for the linear rule (f(x) = ax + b -> f'(x) = a).
  function linearStageHtml(a, b) {
    const coefText = fmtCoefPart(a) || "1";
    const constText = b === 0 ? "" :
      `<span class="linear-drop" id="ld-const">${b < 0 ? " " + QL.MINUS + " " + Math.abs(b) : " + " + b}</span>`;
    return `
      <div class="linear-stage">
        <div class="linear-source">
          <span class="linear-keep" id="ld-coef">${coefText}</span><span class="linear-drop" id="ld-x">x</span>${constText}
        </div>
      </div>`;
  }

  function attachLinearAnimation(overlay) {
    const coefEl = overlay.querySelector("#ld-coef");
    const xEl = overlay.querySelector("#ld-x");
    const constEl = overlay.querySelector("#ld-const"); // may be null if b === 0
    const survivorMs = constEl ? 1150 : 950;

    function playLinearCycle() {
      coefEl.classList.remove("survivor"); void coefEl.offsetWidth;
      xEl.classList.remove("falling"); void xEl.offsetWidth;
      if (constEl) { constEl.classList.remove("falling"); void constEl.offsetWidth; }

      setTimeout(() => { xEl.classList.add("falling"); }, 300);
      if (constEl) setTimeout(() => { constEl.classList.add("falling"); }, 500);

      setTimeout(() => { coefEl.classList.add("survivor"); }, survivorMs);
    }

    requestAnimationFrame(playLinearCycle);
    return setInterval(playLinearCycle, cycleMs(survivorMs, 2200));
  }

  // Implicit differentiation: the #1 real mistake is forgetting to attach the
  // chain-rule y' factor onto a y-term. Shows the term, then the correctly
  // differentiated piece, then the missing "y'" tag flies in and lands —
  // literally highlighting the exact thing students skip.
  function yPrimeStageHtml(term, deriv, tag) {
    return `
      <div class="yprime-stage">
        <div class="yprime-term">${term}</div>
        <div class="yprime-arrow">→</div>
        <div class="yprime-dest">${deriv}<span class="yprime-tag" id="yp-tag">${tag}</span></div>
      </div>`;
  }

  function attachYPrimeAnimation(overlay) {
    const tagEl = overlay.querySelector("#yp-tag");
    function playCycle() {
      tagEl.classList.remove("reveal"); void tagEl.offsetWidth;
      setTimeout(() => { tagEl.classList.add("reveal"); }, 550);
    }
    requestAnimationFrame(playCycle);
    return setInterval(playCycle, cycleMs(550, 1900));
  }

  // Squeeze theorem: the upper and lower bounds visibly converge ("pinch")
  // onto the same value, then that shared value is revealed as the answer —
  // showing WHY the middle function is forced to the same limit, not just
  // asserting it.
  function squeezeStageHtml(lower, middle, upper, answer) {
    return `
      <div class="squeeze-stage">
        <div class="squeeze-bound squeeze-upper" id="sq-upper">${upper}</div>
        <div class="squeeze-bound squeeze-mid">${middle}</div>
        <div class="squeeze-bound squeeze-lower" id="sq-lower">${lower}</div>
        <div class="squeeze-arrow">both bounds squeeze onto</div>
        <div class="squeeze-answer" id="sq-answer">${answer}</div>
      </div>`;
  }

  function attachSqueezeAnimation(overlay) {
    const upperEl = overlay.querySelector("#sq-upper");
    const lowerEl = overlay.querySelector("#sq-lower");
    const answerEl = overlay.querySelector("#sq-answer");
    function playCycle() {
      upperEl.classList.remove("pinch"); lowerEl.classList.remove("pinch");
      answerEl.classList.remove("reveal");
      void upperEl.offsetWidth;
      setTimeout(() => { upperEl.classList.add("pinch"); lowerEl.classList.add("pinch"); }, 350);
      setTimeout(() => { answerEl.classList.add("reveal"); }, 1200);
    }
    requestAnimationFrame(playCycle);
    return setInterval(playCycle, cycleMs(1200, 2700));
  }

  // Derivative by definition: Delta-x visibly shrinks toward 0 inside the
  // difference quotient before the final answer reveals — reinforcing that
  // the whole method IS this limit, not just algebra that happens to work.
  function incrStageHtml(answer) {
    return `
      <div class="incr-stage">
        <div class="incr-quotient">Δy<div class="incr-bar"></div><span class="incr-dx" id="incr-dx">Δx</span></div>
        <div class="incr-arrow">as Δx→0</div>
        <div class="incr-arrow">→</div>
        <div class="incr-answer" id="incr-answer">${answer}</div>
      </div>`;
  }

  function attachIncrAnimation(overlay) {
    const dxEl = overlay.querySelector("#incr-dx");
    const answerEl = overlay.querySelector("#incr-answer");
    function playCycle() {
      dxEl.classList.remove("shrink"); answerEl.classList.remove("reveal");
      void dxEl.offsetWidth;
      setTimeout(() => { dxEl.classList.add("shrink"); }, 350);
      setTimeout(() => { answerEl.classList.add("reveal"); }, 1150);
    }
    requestAnimationFrame(playCycle);
    return setInterval(playCycle, cycleMs(1150, 2400));
  }

  // Optimization: the real mistake this reinforces is skipping the source
  // material's own guideline #4 ("reduce the primary equation to one having
  // a single independent variable") — differentiating a two-variable
  // expression directly instead of substituting the constraint first. The
  // "2 variables" step visibly fades away as "1 variable" takes over, then
  // d/dx=0 leads to the answer.
  function optCritStageHtml(answer) {
    return `
      <div class="optcrit-stage">
        <span class="optcrit-step" id="oc-two">2 variables</span>
        <span class="optcrit-arrow">use the constraint</span>
        <span class="optcrit-step">1 variable</span>
        <span class="optcrit-arrow">→</span>
        <span class="optcrit-step">d/dx = 0</span>
        <span class="optcrit-arrow">→</span>
        <span class="optcrit-answer" id="oc-answer">${answer}</span>
      </div>`;
  }

  function attachOptCritAnimation(overlay) {
    const twoEl = overlay.querySelector("#oc-two");
    const answerEl = overlay.querySelector("#oc-answer");
    function playCycle() {
      twoEl.classList.remove("faded"); answerEl.classList.remove("reveal");
      void twoEl.offsetWidth;
      setTimeout(() => { twoEl.classList.add("faded"); }, 350);
      setTimeout(() => { answerEl.classList.add("reveal"); }, 1300);
    }
    requestAnimationFrame(playCycle);
    return setInterval(playCycle, cycleMs(1300, 2700));
  }

  function showMistakePopup(selEl, blank, q) {
    if (mistakePopupActive) return; // don't stack popups if changes fire in quick succession
    mistakePopupActive = true;

    // screen-wide "took damage" feedback, independent of the card itself
    const flash = document.createElement("div");
    flash.className = "hit-flash";
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 550);
    app.classList.add("shake");
    setTimeout(() => app.classList.remove("shake"), 400);

    const bannerWord = MISS_WORDS[Math.floor(Math.random() * MISS_WORDS.length)];
    const isExponentBlank = selEl.classList.contains("blank-sup");
    const correctText = blank.options[blank.correctIndex];
    const normalized = correctText.replace(/−/g, "-");
    const isNumeric = /^-?\d+$/.test(normalized);
    // Whole-term power rule (f(x) = a·xⁿ, or with a trailing constant): show the
    // FULL term ("9x²"), not a generic "x²" — fires for a wrong pick on EITHER the
    // coefficient blank or the exponent blank, since both are about the same rule.
    const powerShape = q && q.powerRuleShape;
    const isPowerShapeMistake = !!(powerShape && (blank.key === powerShape.coefKey || blank.key === powerShape.expKey));
    // Fallback generic diagram (chain rule etc.): only the exponent's own blank, no
    // known original coefficient to show, so animate a bare "xⁿ".
    const isExpDiagram = !isPowerShapeMistake && isExponentBlank && !blank.fixedExp && isNumeric;
    const showsFlyDiagram = isPowerShapeMistake || isExpDiagram;
    const isFixedExpMistake = isExponentBlank && blank.fixedExp;
    const showsRuleDiagram = !isPowerShapeMistake && !isFixedExpMistake && q && q.ruleShape && (q.ruleShape.kind === "product" || q.ruleShape.kind === "quotient");
    const showsConstDiagram = blank.constValue !== undefined;

    let reduced = 0, original = 0;
    let innerHtml;

    if (isPowerShapeMistake) {
      const { a, n } = powerShape;
      reduced = n - 1;
      original = n;
      const coefText = fmtCoefPart(a);
      const srcCoefHtml = coefText ? `<span>${coefText}</span>` : "";
      const destCoefPrefix = coefText ? `<span class="exp-dest-prefix" id="mp-prefix">${coefText}·</span>` : "";
      innerHtml = `
        <div class="mistake-banner">${bannerWord}</div>
        <div class="mistake-tag">Power Rule</div>
        <div class="exp-stage">
          <div class="exp-source">
            ${srcCoefHtml}<span>x</span><sup class="exp-num exp-num--source" id="mp-src">${original}</sup>
          </div>
          <div class="exp-arrow">→</div>
          <div class="exp-dest">
            ${destCoefPrefix}<span class="exp-num exp-num--flycoef" id="mp-coef">${original}</span>
            <span>&nbsp;·&nbsp;x</span><sup class="exp-num exp-num--flyexp" id="mp-exp">${reduced}</sup>
          </div>
        </div>`;
    } else if (isExpDiagram) {
      reduced = parseInt(normalized, 10);
      original = reduced + 1;
      innerHtml = `
        <div class="mistake-banner">${bannerWord}</div>
        <div class="mistake-tag">Power Rule</div>
        <div class="exp-stage">
          <div class="exp-source">
            <span>x</span><sup class="exp-num exp-num--source" id="mp-src">${original}</sup>
          </div>
          <div class="exp-arrow">→</div>
          <div class="exp-dest">
            <span class="exp-num exp-num--flycoef" id="mp-coef">${original}</span>
            <span>&nbsp;·&nbsp;x</span><sup class="exp-num exp-num--flyexp" id="mp-exp">${reduced}</sup>
          </div>
        </div>`;
    } else if (isFixedExpMistake) {
      innerHtml = `
        <div class="mistake-banner">${bannerWord}</div>
        <div class="mistake-tag">Always v²</div>
        <div class="reveal-stage"><div class="reveal-answer">${escapeHtml(correctText)}</div></div>`;
    } else if (showsConstDiagram) {
      innerHtml = `
        <div class="mistake-banner">${bannerWord}</div>
        <div class="mistake-tag">Constant Rule</div>
        ${constStageHtml(blank.constValue)}`;
    } else if (showsRuleDiagram && q.ruleShape.kind === "product") {
      const { u, v, uPrime, vPrime } = q.ruleShape;
      innerHtml = `
        <div class="mistake-banner">${bannerWord}</div>
        <div class="mistake-tag">Product Rule</div>
        <div class="rule-stage">
          <div class="rule-source">
            <span class="rule-sym-wrap"><span class="rule-sym" id="rp-u">${u}</span><span class="dmg-popup" id="rp-primeU">′</span></span>
            <span>·</span>
            <span class="rule-sym-wrap"><span class="rule-sym" id="rp-v">${v}</span><span class="dmg-popup" id="rp-primeV">′</span></span>
          </div>
          <div class="rule-arrow">↓</div>
          <div class="rule-dest">
            <span class="rule-term" id="rp-term1">${uPrime}·${v}</span>
            <span class="rule-plus" id="rp-plus">+</span>
            <span class="rule-term" id="rp-term2">${u}·${vPrime}</span>
          </div>
        </div>`;
    } else if (showsRuleDiagram && q.ruleShape.kind === "quotient") {
      const { u, v, uPrime, vPrime } = q.ruleShape;
      innerHtml = `
        <div class="mistake-banner">${bannerWord}</div>
        <div class="mistake-tag">Quotient Rule</div>
        <div class="rule-stage">
          <div class="rule-source">
            <span class="rule-sym-wrap"><span class="rule-sym" id="rp-u">${u}</span><span class="dmg-popup" id="rp-primeU">′</span></span>
            <span>/</span>
            <span class="rule-sym-wrap"><span class="rule-sym" id="rp-v">${v}</span><span class="dmg-popup" id="rp-primeV">′</span></span>
          </div>
          <div class="rule-arrow">↓</div>
          <div class="rule-dest">
            (<span class="rule-term" id="rp-term1">${uPrime}·${v}</span>
            <span class="rule-minus" id="rp-minus">−</span>
            <span class="rule-term" id="rp-term2">${u}·${vPrime}</span>)&nbsp;/&nbsp;<span class="rule-term" id="rp-vsq">${v}${QL.sup(2)}</span>
          </div>
        </div>`;
    } else {
      innerHtml = `
        <div class="mistake-banner">${bannerWord}</div>
        <div class="reveal-stage"><div class="reveal-answer">${escapeHtml(correctText)}</div></div>`;
    }

    const overlay = document.createElement("div");
    overlay.className = "mistake-overlay";
    overlay.innerHTML = `
      <div class="mistake-card">
        ${innerHtml}
        <div class="mistake-hint">tap to continue</div>
      </div>`;
    document.body.appendChild(overlay);

    let loopTimer = null;
    if (showsFlyDiagram) {
      const stage = overlay.querySelector(".exp-stage");
      const src = overlay.querySelector("#mp-src");
      const coefDest = overlay.querySelector("#mp-coef");
      const expDest = overlay.querySelector("#mp-exp");
      const prefixDest = overlay.querySelector("#mp-prefix");
      const FLIGHT_MS = 700; // must match .exp-flying-clone's transform transition duration

      function spawnClone(destEl, stageRect, srcRect, isExpTarget) {
        const destRect = destEl.getBoundingClientRect();
        const clone = document.createElement("span");
        clone.className = "exp-flying-clone";
        clone.style.left = (srcRect.left - stageRect.left) + "px";
        clone.style.top = (srcRect.top - stageRect.top) + "px";
        const numSpan = document.createElement("span");
        numSpan.className = "clone-num";
        numSpan.textContent = String(original);
        clone.appendChild(numSpan);
        if (isExpTarget) {
          const dmg = document.createElement("span");
          dmg.className = "dmg-popup";
          dmg.textContent = "−1";
          clone.appendChild(dmg);
        }
        stage.appendChild(clone);
        requestAnimationFrame(() => {
          clone.style.transform = `translate(${destRect.left - srcRect.left}px, ${destRect.top - srcRect.top}px)`;
        });
        return clone;
      }

      // Both copies of the exponent depart together and fly the whole distance;
      // the copy headed for the exponent slot only loses its "-1" at the MIDPOINT
      // of that flight (not before takeoff, not after landing) — you watch the
      // subtraction happen mid-transit, right on the number that's changing.
      function playCycle() {
        stage.querySelectorAll(".exp-flying-clone").forEach(c => c.remove());
        coefDest.classList.remove("reveal");
        expDest.classList.remove("reveal");
        if (prefixDest) prefixDest.classList.remove("reveal");

        const stageRect = stage.getBoundingClientRect();
        const srcRect = src.getBoundingClientRect();

        const c1 = spawnClone(coefDest, stageRect, srcRect, false);
        const c2 = spawnClone(expDest, stageRect, srcRect, true);

        setTimeout(() => {
          c2.querySelector(".clone-num").textContent = String(reduced);
          const dmg = c2.querySelector(".dmg-popup");
          if (dmg) dmg.classList.add("play");
          c2.classList.add("subtracted");
        }, FLIGHT_MS / 2);

        setTimeout(() => {
          c1.classList.add("arrived");
          c2.classList.add("arrived");
          coefDest.classList.add("reveal");
          expDest.classList.add("reveal");
          if (prefixDest) prefixDest.classList.add("reveal");
          setTimeout(() => { c1.remove(); c2.remove(); }, 450);
        }, FLIGHT_MS);
      }

      requestAnimationFrame(playCycle);
      loopTimer = setInterval(playCycle, cycleMs(FLIGHT_MS, FLIGHT_MS + 1300));
    } else if (showsRuleDiagram) {
      const uSym = overlay.querySelector("#rp-u");
      const vSym = overlay.querySelector("#rp-v");
      const primeU = overlay.querySelector("#rp-primeU");
      const primeV = overlay.querySelector("#rp-primeV");
      const term1 = overlay.querySelector("#rp-term1");
      const term2 = overlay.querySelector("#rp-term2");
      const plusEl = overlay.querySelector("#rp-plus");
      const minusEl = overlay.querySelector("#rp-minus");
      const vsqEl = overlay.querySelector("#rp-vsq");
      const isQuotient = q.ruleShape.kind === "quotient";
      const joinEl = isQuotient ? minusEl : plusEl;

      function resetPlay(el) { if (el) { el.classList.remove("play"); void el.offsetWidth; } }
      function resetReveal(el) { if (el) el.classList.remove("reveal"); }

      // u gets differentiated first (term u′v appears), then v (term uv′/−uv′
      // appears); same hit-flash + prime "damage popup" language as the power
      // rule, just applied to each factor in turn instead of one exponent.
      function playRuleCycle() {
        uSym.classList.remove("hit"); vSym.classList.remove("hit");
        void uSym.offsetWidth;
        resetPlay(primeU); resetPlay(primeV);
        resetReveal(term1); resetReveal(term2); resetReveal(joinEl); resetReveal(vsqEl);

        setTimeout(() => { uSym.classList.add("hit"); if (primeU) primeU.classList.add("play"); }, 200);
        setTimeout(() => { term1.classList.add("reveal"); }, 600);
        setTimeout(() => { vSym.classList.add("hit"); if (primeV) primeV.classList.add("play"); }, 1000);
        setTimeout(() => { joinEl.classList.add("reveal"); }, 1350);
        setTimeout(() => { term2.classList.add("reveal"); }, 1450);
        if (isQuotient) setTimeout(() => { vsqEl.classList.add("reveal"); }, 1850);
      }

      const cycleLength = cycleMs(isQuotient ? 1850 : 1450, isQuotient ? 2600 : 2200);
      requestAnimationFrame(playRuleCycle);
      loopTimer = setInterval(playRuleCycle, cycleLength);
    } else if (showsConstDiagram) {
      loopTimer = attachConstAnimation(overlay);
    }

    let dismissed = false;
    function dismiss() {
      if (dismissed) return;
      dismissed = true;
      if (loopTimer) clearInterval(loopTimer);
      overlay.style.transition = "opacity 0.12s ease-in";
      overlay.style.opacity = "0";
      setTimeout(() => { overlay.remove(); mistakePopupActive = false; }, 130);
    }
    overlay.addEventListener("click", dismiss);
  }

  function goHome() { state = { screen: "home" }; render(); }

  function goSummary() {
    bestScores[state.level.num] = { correct: state.correctCount, total: state.questions.length };
    state.screen = "summary";
    render();
  }

  function renderSummary() {
    const total = state.questions.length;
    const correct = state.correctCount;
    const pct = Math.round((correct / total) * 100);
    const noun = state.level.isExam ? "exam" : "level";
    let msg;
    if (pct === 100) msg = `Perfect score! You've mastered this ${noun}.`;
    else if (pct >= 70) msg = "Solid work — review the ones you missed and try again.";
    else msg = `Keep practicing — try this ${noun} again with a fresh random set.`;

    const nextLevel = LEVELS.find(l => l.num === state.level.num + 1);
    const titleLabel = state.level.isExam ? escapeHtml(state.level.title) : `Level ${state.level.num}: ${escapeHtml(state.level.title)}`;

    app.innerHTML = `
      <div class="summary-card">
        <div class="qtag" style="text-align:center;">${titleLabel} — Complete</div>
        <div class="summary-score">${correct}<span> / ${total}</span></div>
        <div class="summary-msg">${msg}</div>
        <div class="actions-row" style="justify-content:center;">
          <button class="btn-primary" data-retry>↻ Retry (New Random Set)</button>
          ${nextLevel ? `<button class="btn-primary" data-next-level>Next: Level ${nextLevel.num} →</button>` : ""}
          <button class="btn-secondary" data-go-home>Home</button>
        </div>
      </div>
    `;
    app.querySelector("[data-retry]").addEventListener("click", () => startLevel(state.level.num));
    app.querySelector("[data-go-home]").addEventListener("click", goHome);
    if (nextLevel) app.querySelector("[data-next-level]").addEventListener("click", () => startLevel(nextLevel.num));
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  render();
})();
</script>
</body>
</html>
